name: clone-google-drive
services:
  frontend-angular:
    container_name: $FRONTEND_CONTAINER
    image: $FRONTEND_IMAGE
    build:
      context: ../
      dockerfile: ./frontend/deploy/Dockerfile
    restart: always
    networks:
      - gdrive-network
    depends_on:
      upload-service:
        condition: service_healthy

  upload-service:
    container_name: $UPLOAD_CONTAINER
    image: $UPLOAD_IMAGE
    build:
      context: ../
      dockerfile: ./upload-service/Dockerfile
    networks:
      - gdrive-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8080/health || exit 1 "]
      interval: 5s
      timeout: 4s
      retries: 4
      start_period: 25s
    depends_on:
      minio-storage:
        condition: service_healthy
      postgres_service:
        condition: service_healthy

  minio-storage:
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: $MINIO_CONTAINER
    env_file:
      - .minio.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1 "]
      interval: 5s
      timeout: 4s
      retries: 4
      start_period: 25s
    networks:
      - gdrive-network

  postgres_service:
    image: postgres:16
    container_name: $POSTGRES_CONTAINER
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - gdrive-network

  ngrok-service:
    image: ngrok/ngrok
    container_name: $NGROK_CONTAINER
    command: "start my-app-endpoint --config /etc/ngrok.yml"
    volumes:
      - "${NGROK_CONFIG_PATH}:/etc/ngrok.yml"
    depends_on:
      - frontend-angular
    networks:
      - gdrive-network

networks:
  gdrive-network:
    driver: bridge

volumes:
  minio_data:
    driver: local
  pg_data:
    driver: local
